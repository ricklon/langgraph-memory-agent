[project]
name = "langgraph-memory-agent"
version = "0.1.0"
description = "A LangGraph chat agent with short-term (checkpointer) and long-term (store) memory, running qwen3.5:4b on local Ollama"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
]
